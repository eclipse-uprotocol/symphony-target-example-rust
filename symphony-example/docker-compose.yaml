networks:
  vehicle:
    driver: overlay
    attachable: true

services:
  symphony-api:
    image: ghcr.io/eclipse-symphony/symphony-api:0.48.43
    container_name: symphony-api
    networks:
      - vehicle
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./zenoh-config.json5:/zenoh-config.json5:ro
    environment:
      - USE_SERVICE_ACCOUNT_TOKENS=false
      - SYMPHONY_API_URL=http://localhost:8082/v1alpha2/
      - CONFIG=/symphony-api-no-k8s.json
      - LOG_LEVEL=Error
      - RUST_LOG=info,uprotocol=debug
    restart: unless-stopped
  ecu-updater:
    image: ghcr.io/eclipse-uprotocol/ecu-updater:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ecu-updater
    command: ["zenoh"]
    networks:
      - vehicle
    environment:
      - UP_AUTHORITY=ecu-updater
      - UP_ENTITY_ID=0x0001A100
      - RUST_LOG=info
